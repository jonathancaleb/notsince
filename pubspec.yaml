name: notsince
description: "A days-since tracker for one commitment. On-device only."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  alarm: ^5.12.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_animate: ^4.5.2
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6
  # Pinned below 13: permission_handler 13 requires compileSdk 37, which
  # Android Gradle Plugin 9.1.0 does not support (its maximum is 36).
  permission_handler: ^12.0.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  hive_ce_generator: ^1.11.3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/fonts/Baloo2-OFL.txt
    - assets/fonts/Quicksand-OFL.txt
    - assets/fonts/NanumPenScript-OFL.txt

  fonts:
    - family: NanumPen
      fonts:
        - asset: assets/fonts/NanumPenScript-400.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-400.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-400.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-500.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-600.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-700.ttf
          weight: 700

